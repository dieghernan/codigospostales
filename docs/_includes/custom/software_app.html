<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "@id": {{ page.url | absolute_url | append: '#app' | jsonify }},
  "name": {{ page.title | jsonify }},
  "description": {{ page.description | default: page.excerpt | strip_html | strip | jsonify }},
  "image": {{ site.og_image | absolute_url | jsonify }},
  "about": {"@type": "Dataset", "@id": {{ '/' | absolute_url | append: '#dataset' | jsonify }}, "name": "Áreas postales estimadas de España", "url": {{ '/' | absolute_url | jsonify }}},
  "isBasedOn": {"@type": "SoftwareSourceCode", "codeRepository": "https://github.com/dieghernan/codigospostales", "programmingLanguage": "JavaScript"},
  "softwareHelp": {{ '/visor/' | absolute_url | jsonify }},
  "url": {{ page.url | absolute_url | jsonify }},
  "applicationCategory": "ReferenceApplication",
  "operatingSystem": "Any",
  "browserRequirements": "Requiere JavaScript y un navegador web compatible con Leaflet.",
  "inLanguage": "es",
  "isAccessibleForFree": true,
  "author": {
    "@type": "Person",
    "@id": {{ '/' | absolute_url | append: '#author' | jsonify }},
    "name": "Diego Hernangómez",
    "sameAs": "https://orcid.org/0000-0001-8457-4658",
    "url": {{ site.author.url | jsonify }}
  },
  "offers": {
    "@type": "Offer",
    "price": 0,
    "priceCurrency": "EUR"
  }
}
</script>
{% include custom/dataset.html %}
