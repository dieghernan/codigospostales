# Sitio del proyecto. Compilar con docs/ como directorio de trabajo.
remote_theme: dieghernan/chulapa
repository: dieghernan/codigospostales
url: https://dieghernan.github.io
baseurl: /codigospostales

locale: es-ES
og_locale: es_ES
timezone: Europe/Madrid
title: Códigos postales de España
subtitle: Mapa y descarga de áreas postales estimadas
description: >-
  Áreas postales estimadas a partir de CartoCiudad y límites administrativos.
  Disponible en GeoPackage para R, Python y SIG.

og_image: /assets/img/social-preview.jpg
og_image_alt: Códigos postales de España. Mapa de las áreas postales estimadas con prefijo 28 a partir de los datos del proyecto.
og_image_width: 1200
og_image_height: 630
og_image_type: image/jpeg
twitter_site: dhernangomez
gtag_id: G-YJD3C3D1M1

author:
  name: dieghernan
  url: https://dieghernan.github.io/
  avatar: https://dieghernan.github.io/assets/img/site/avatar.png
  location: Madrid, Spain
  links:
    - url: https://dieghernan.github.io/
      icon: fas fa-blog
      label: Web personal
    - url: https://github.com/dieghernan
      icon: fab fa-github
      label: GitHub
    - url: https://orcid.org/0000-0001-8457-4658
      icon: fa-brands fa-orcid
      label: ORCID
    - url: https://fosstodon.org/@dhernangomez
      icon: fa-brands fa-mastodon
      label: Mastodon
    - url: https://bsky.app/profile/dieghernan.bsky.social
      icon: fa-brands fa-square-bluesky
      label: Bluesky
    - url: https://x.com/dhernangomez
      icon: fab fa-square-x-twitter
      label: Twitter/X
    - url: https://stackoverflow.com/users/7877917/dieghernan
      icon: fab fa-stack-overflow
      label: Stack Overflow

publisher:
  type: Person
  name: dieghernan
  url: https://dieghernan.github.io/
  image: https://dieghernan.github.io/assets/img/site/avatar.png

fa_version: "6"

chulapa-skin:
  skin: focal
  highlight: github

webmentions:
  endpoint: https://webmention.io/dieghernan.github.io/webmention
  pingback: https://webmention.io/dieghernan.github.io/xmlrpc

navbar:
  brand:
    title: '<i class="fas fa-home" aria-hidden="true" style="color: inherit"></i><span class="sr-only">Inicio</span>'

  nav:
    - title: Descargas
      url: /#archivos-disponibles
    - title: Visor
      url: /visor/
    - title: Ejemplos
      url: /ejemplos/
    - title: GitHub
      url: https://github.com/dieghernan/codigospostales

footer:
  links:
    - label: dieghernan
      icon: fas fa-blog
      url: https://dieghernan.github.io/
    - label: GitHub
      icon: fab fa-github
      url: https://github.com/dieghernan/codigospostales
    - label: ORCID
      icon: fa-brands fa-orcid
      url: https://orcid.org/0000-0001-8457-4658
    - label: Mastodon
      icon: fa-brands fa-mastodon
      url: https://fosstodon.org/@dhernangomez
    - label: Bluesky
      icon: fa-brands fa-square-bluesky
      url: https://bsky.app/profile/dieghernan.bsky.social
    - label: Twitter/X
      icon: fab fa-square-x-twitter
      url: https://x.com/dhernangomez
    - label: Stack Overflow
      icon: fab fa-stack-overflow
      url: https://stackoverflow.com/users/7877917/dieghernan

defaults:
  - scope:
      path: ""
    values:
      layout: default
      header_type: base
      show_author: false
      show_date: false
      show_sociallinks: false
      show_webmentions: true
      include_on_search: false
      include_on_feed: false

plugins:
  - jekyll-remote-theme
  - jekyll-github-metadata
  - jekyll-include-cache
  - jekyll-sitemap

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - .bundle

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  toc_levels: 2..4

sass:
  sass_dir: _sass
  style: compressed
  quiet_deps: true
  silence_deprecations:
  - import
  - global-builtin
  - color-functions
  - abs-percent
  - function-units

compress_html:
  clippings: all
  blanklines: true

strict_front_matter: true
