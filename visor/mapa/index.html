<body class="postal-map-page">
<main class="postal-map-app">
  <nav class="postal-map-toolbar" aria-label="Navegación del visor">
    <a href="/codigospostales/visor/" target="_top">Documentación</a>
    <span>Límites estimados · no oficiales</span>
  </nav>
  <section class="postal-map-controls" aria-label="Filtro de códigos postales">
  <label for="postal-prefix">Prefijo postal</label>
  <select id="postal-prefix" class="form-control" disabled aria-describedby="postal-prefix-help map-status">
    <option value="08">08xxx (Barcelona)</option>
  </select>
  <p id="postal-prefix-help">Los nombres son orientativos: se filtra por los dos
    primeros dígitos del CP, sin recortar por límites provinciales.</p>
  <p id="map-status" role="status" aria-live="polite">Cargando el visor…</p>
</section>
<div id="postal-map" role="region" aria-label="Mapa de códigos postales" tabindex="0"
  data-source="/codigospostales/assets/data/"></div>
<noscript><p>Activa JavaScript para utilizar el visor.</p></noscript>

</main>
